name: CI - Deploy to Dev

on:
  push:
    branches: [ main ]
    paths:
      - 'workspace/**'
      - 'deploy/**'
      - '.github/workflows/**'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  id-token: write   # GitHub OIDC -> Entra
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Deploy to Dev
        env:
          FABRIC_ENVIRONMENT: Dev
          FABRIC_WORKSPACE_ID: ${{ vars.FABRIC_WORKSPACE_ID }}
          FABRIC_REPO_DIR: workspace
        run: python deploy/deploy.py
